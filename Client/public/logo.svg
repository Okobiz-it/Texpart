<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 92" fill="none" width="100%" height="100%">
  <!-- Icon: 3 Fabric & Packaging Swatches above the central lettering -->
  <g transform="translate(136, 4)">
    <!-- Swatch 1 (Left: Sewing / Stitch Fabric Tag) -->
    <g transform="rotate(-12 18 20)">
      <rect x="0" y="0" width="22" height="34" rx="4" fill="#0EA5E9" />
      <!-- Stitch Lines -->
      <line x1="4" y1="8" x2="18" y2="8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" />
      <line x1="4" y1="16" x2="18" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" />
      <line x1="4" y1="24" x2="18" y2="24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" />
    </g>

    <!-- Swatch 2 (Center: Woven Grid / Pattern Tag) -->
    <g transform="translate(14, -2)">
      <rect x="0" y="0" width="22" height="34" rx="4" fill="#0284C7" />
      <!-- Grid Weave Pattern -->
      <line x1="5" y1="6" x2="17" y2="6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
      <line x1="5" y1="12" x2="17" y2="12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
      <line x1="5" y1="18" x2="17" y2="18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
      <line x1="5" y1="24" x2="17" y2="24" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
      <line x1="8" y1="4" x2="8" y2="28" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
      <line x1="14" y1="4" x2="14" y2="28" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Swatch 3 (Right: Precision Inspection & Quality Tag) -->
    <g transform="translate(32, 2) rotate(12 11 17)">
      <rect x="0" y="0" width="22" height="34" rx="4" fill="#0369A1" />
      <!-- Magnifier / Inspection Loop -->
      <circle cx="10" cy="14" r="5.5" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <line x1="14" y1="18" x2="18" y2="24" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Wordmark: "texpart" in Deep Charcoal (#171A19) -->
  <text x="190" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Manrope', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#171A19" letter-spacing="-1.5">texpart</text>

  <!-- Subtitle: "DESIGN & PACKAGING SOLUTIONS" -->
  <text x="190" y="85" text-anchor="middle" font-family="'Inter', 'Manrope', sans-serif" font-weight="800" font-size="8.5" fill="#0284C7" letter-spacing="3.2">DESIGN &amp; PACKAGING SOLUTIONS</text>
</svg>

